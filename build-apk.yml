# .github/workflows/build-apk.yml
# Compile l'APK du fork sur GitHub (onglet Actions > "Build APK" > Run workflow).
# L'APK sort dans les Releases du depot. Il s'installe A COTE de l'appli officielle
# (identifiant com.lasrecomp.android.fork), sans toucher a ses sauvegardes.
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 30.0.16248370
  CMAKE_VERSION: 3.30.4
  # Cle de signature du fork (usage personnel). Elle est publique dans ce depot :
  # elle sert seulement a ce que chaque build puisse se mettre a jour par-dessus le precedent.
  FORK_KEYSTORE_B64: 
  FORK_KEYSTORE_PASS: lasfork2026

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (NDK, CMake, plateforme)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
          # les scripts du projet lisent ces variables ; celles du runner pointent vers un autre NDK
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache des dependances compilees
        uses: actions/cache@v4
        with:
          path: |
            android/deps/out
            android/deps/src
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/*.sh') }}

      - name: Dependances de l'appli (SDL3, shaderc, Vulkan)
        run: bash android/deps/build_deps.sh

      - name: FFmpeg (videos du jeu)
        run: |
          if [ ! -f android/deps/out/lib/libavcodec.so ]; then bash android/deps/build_ffmpeg.sh; fi

      - name: Constructeur du code du jeu (Python, capstone, unicorn, lz4, zig)
        run: bash android/deps/build_gen_deps.sh

      - name: Identite du fork (installation a cote de l'appli officielle)
        run: |
          G=android/lasrecomp/app/build.gradle.kts
          sed -i -E 's/applicationId = "com\.lasrecomp\.android"/applicationId = "com.lasrecomp.android.fork"/' "$G"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $((100000 + GITHUB_RUN_NUMBER))/" "$G"
          sed -i -E "s/versionName = \"([^\"]+)\"/versionName = \"\1-fork.${GITHUB_RUN_NUMBER}\"/" "$G"
          sed -i 's/android:targetPackage="com\.lasrecomp\.android"/android:targetPackage="com.lasrecomp.android.fork"/' \
              android/lasrecomp/app/src/main/res/xml/shortcuts.xml
          sed -i 's/android:label="LAS Recomp"/android:label="LAS Recomp Fork"/' \
              android/lasrecomp/app/src/main/AndroidManifest.xml
          grep -n "applicationId\|versionCode\|versionName" "$G"

      - name: Cle de signature
        run: |
          mkdir -p "$HOME/.lasrecomp"
          echo "$FORK_KEYSTORE_B64" | base64 -d > "$HOME/.lasrecomp/fork.p12"
          {
            echo "storeFile=$HOME/.lasrecomp/fork.p12"
            echo "storePassword=$FORK_KEYSTORE_PASS"
            echo "keyAlias=lasfork"
            echo "keyPassword=$FORK_KEYSTORE_PASS"
          } > "$HOME/.lasrecomp/keystore.properties"

      - name: Compilation de l'APK
        working-directory: android/lasrecomp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: |
          cp android/lasrecomp/app/build/outputs/apk/release/app-release.apk "LASRecomp-fork-${GITHUB_RUN_NUMBER}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-fork-${{ github.run_number }}
          path: LASRecomp-fork-*.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fork-${GITHUB_RUN_NUMBER}" "LASRecomp-fork-${GITHUB_RUN_NUMBER}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fork build ${GITHUB_RUN_NUMBER}" \
            --notes "Build automatique du fork (commit ${GITHUB_SHA::7}). S'installe a cote de l'appli officielle."
