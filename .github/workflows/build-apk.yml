# .github/workflows/build-apk.yml
# Compile l'APK du fork sur GitHub (onglet Actions > "Build APK" > Run workflow).
# L'APK sort dans les Releases du depot. Il s'installe A COTE de l'appli officielle
# (identifiant com.lasrecomp.android.fork), sans toucher a ses sauvegardes.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      modifications:
        description: "Appliquer les modifications du fork (decocher = code d'origine)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  NDK_VERSION: 30.0.16248370
  CMAKE_VERSION: 3.30.4
  # Cle de signature du fork (usage personnel). Elle est publique dans ce depot :
  # elle sert seulement a ce que chaque build puisse se mettre a jour par-dessus le precedent.
  FORK_KEYSTORE_B64: 
  FORK_KEYSTORE_PASS: lasfork2026

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Modifications du fork (resolution des ombres)
        if: ${{ inputs.modifications }}
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # Modifications du fork, appliquees au code avant la compilation.
          # Chaque modification cherche un repere exact dans le fichier : si le code d'origine a change
          # et que le repere a disparu, le script s'arrete avec un message clair au lieu de compiler n'importe quoi.
          import sys

          def edit(path, anchor, new, where="after", count=1):
              src = open(path, encoding="utf-8").read()
              n = src.count(anchor)
              if n != count:
                  sys.exit("FORK: repere introuvable ou ambigu (%d fois au lieu de %d) dans %s :\n  %r" % (n, count, path, anchor))
              if where == "after":
                  out = src.replace(anchor, anchor + new)
              elif where == "before":
                  out = src.replace(anchor, new + anchor)
              else:
                  out = src.replace(anchor, new)
              open(path, "w", encoding="utf-8").write(out)
              print("FORK: %s modifie" % path)

          # ---------------------------------------------------------------- 1. le reglage
          edit("runtime/settings.h",
               "    bool shader_int32;",
               "    int shadow_scale;     // (fork) the shadow map drawn at 1x / 2x / 4x its own size (vulkan/textures.c)\n",
               "before")
          edit("runtime/settings.c",
               '        else if (!strcmp(key, "shader_int32")) g_settings.shader_int32 = atoi(val) != 0;\n',
               '        else if (!strcmp(key, "shadow_scale")) g_settings.shadow_scale = atoi(val);\n')
          edit("runtime/settings.c",
               '    fprintf(f, "shader_int32 = %d\\n", g_settings.shader_int32);\n',
               '    fprintf(f, "shadow_scale = %d\\n", g_settings.shadow_scale);\n')

          # ---------------------------------------------------------------- 2. le menu (onglet Video)
          edit("runtime/ui/menu.mm",
               '    opt_toggle("Frame generation", &g_settings.frame_gen, false,',
               '''    {   // (fork)
                  static const char *shq[] = {"Original", "2x", "4x"};
                  int si = g_settings.shadow_scale >= 4 ? 2 : g_settings.shadow_scale >= 2 ? 1 : 0;
                  if (opt_choice("Shadow resolution (fork)", &si, shq, 3, 0,
                                 "Experimental. Draws the game's shadow map larger than the Switch's own size, so shadow edges "
                                 "stop flickering while the camera moves, at any internal resolution. Costs some GPU time and "
                                 "memory. Original: the game's own size."))
                      g_settings.shadow_scale = si == 2 ? 4 : si == 1 ? 2 : 1;
              }
          ''',
               "before")

          # ---------------------------------------------------------------- 3. le moteur de rendu
          edit("runtime/nvn/vulkan/vk.h",
               "    bool scalable, presented;\n",
               "    uint8_t shadow;  // (fork) textures.c vk_shadow_target: 0 new, 1 a shadow map drawn larger, 2 left alone, 3 seen\n")

          edit("runtime/nvn/vulkan/textures.c",
               '#include "vk.h"\n',
               '#include "../../settings.h"  // (fork: shadow_scale)\n')

          edit("runtime/nvn/vulkan/textures.c",
               "// An image's share of the internal resolution: the game's own size, or (render targets) the internal resolution's.\n",
               '''#ifdef __ANDROID__
          // (fork) The shadow map: the game draws it at its own fixed size whatever the internal resolution, and its texels
          // crawl over the ground as the camera moves. Shadow resolution (the Video tab) draws it 2x / 4x larger, up to 4096.
          static float shadow_factor(const NvnTexture *t) {
              int f = g_settings.shadow_scale;
              if (f < 1) f = 1;
              if (f > 4) f = 4;
              uint32_t side = t->width > t->height ? t->width : t->height;
              while (f > 1 && side * (uint32_t)f > 4096) f--;
              return (float)f;
          }
          #endif
          ''',
               "before")

          edit("runtime/nvn/vulkan/textures.c",
               "static void tex_scale(const NvnTexture *t, const TexBackend *b, float *sx, float *sy) {\n",
               '''#ifdef __ANDROID__
              if (b->shadow == 1) { *sx = *sy = shadow_factor(t); return; }
          #endif
          ''')

          edit("runtime/nvn/vulkan/textures.c",
               "static void texture_snapshot_forget(TexBackend *b);\n",
               '''#ifdef __ANDROID__
          // (fork) exec.c, at each pass with a depth target: a square depth image drawn into with no color target is the shadow
          // map - from then on it is a scaled target as the scene's are (its passes' viewports and the shaders that read it
          // follow its scale, renderer_texture_scale), at shadow_factor. Anything else is left at its own size, and said once.
          void vk_shadow_target(NvnTexture *t, int ncolor) {
              if (!t || !renderer_format_is_depth(t->format)) return;
              TexBackend *b = tex_backend(t);
              if (b->shadow == 2 || (b->scalable && b->shadow != 1)) return;  // (left alone already / the scene's own depth)
              bool square = t->width == t->height && t->width >= 256 && t->target == 1 && t->samples <= 1;
              if (!square) {  // (never a shadow map: said once when it is drawn into alone)
                  if (!ncolor) LOG("[shadow] depth-only target %ux%u (format %#x, target %u, samples %u): left at its own size\\n",
                                   t->width, t->height, t->format, t->target, t->samples);
                  b->shadow = 2;
                  return;
              }
              if (ncolor) {  // (with a color target of another scale a larger depth image would not match it: back to its size)
                  if (b->shadow == 1) {
                      LOG("[shadow] shadow map %ux%u drawn into with %d color target(s): left at its own size from now on\\n",
                          t->width, t->height, ncolor);
                      b->shadow = 2;
                      b->scalable = tex_scalable(t);
                      destroy_image(b);
                      create_image(t, b);
                  }
                  return;
              }
              if (b->shadow == 0) {
                  b->shadow = 3;
                  LOG("[shadow] shadow map %ux%u (format %#x)\\n", t->width, t->height, t->format);
              }
              if (b->shadow == 3 && g_settings.shadow_scale > 1) {
                  b->shadow = 1;
                  b->scalable = true;
                  float wx, wy;
                  tex_scale(t, b, &wx, &wy);
                  LOG("[shadow] shadow map %ux%u drawn at %.0fx\\n", t->width, t->height, wx);
                  if (b->sx != wx || b->sy != wy) { destroy_image(b); create_image(t, b); }
              }
          }
          #endif

          ''',
               "before")

          edit("runtime/nvn/vulkan/exec.c",
               "void renderer_texture_scale(NvnTexture *t, float *sx, float *sy);\n",
               "#ifdef __ANDROID__\nvoid vk_shadow_target(NvnTexture *t, int ncolor);  // (fork: textures.c)\n#endif\n")

          edit("runtime/nvn/vulkan/exec.c",
               "        renderer_mark_gpu_owned(st.rt.depth);\n",
               '''#ifdef __ANDROID__
                  {   // (fork) the shadow map, before its view is made: textures.c
                      int nc = 0;
                      for (int i = 0; i < st.rt.ncolor; i++) nc += st.rt.color[i] != NULL;
                      vk_shadow_target(st.rt.depth, nc);
                  }
          #endif
          ''',
               "before")

          print("FORK: toutes les modifications sont appliquees")
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (NDK, CMake, plateforme)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
          # les scripts du projet lisent ces variables ; celles du runner pointent vers un autre NDK
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache des dependances compilees
        uses: actions/cache@v4
        with:
          path: |
            android/deps/out
            android/deps/src
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/*.sh') }}

      - name: Dependances de l'appli (SDL3, shaderc, Vulkan)
        run: bash android/deps/build_deps.sh

      - name: FFmpeg (videos du jeu)
        run: |
          if [ ! -f android/deps/out/lib/libavcodec.so ]; then bash android/deps/build_ffmpeg.sh; fi

      - name: Constructeur du code du jeu (Python, capstone, unicorn, lz4, zig)
        run: bash android/deps/build_gen_deps.sh

      - name: Identite du fork (installation a cote de l'appli officielle)
        run: |
          G=android/lasrecomp/app/build.gradle.kts
          sed -i -E 's/applicationId = "com\.lasrecomp\.android"/applicationId = "com.lasrecomp.android.fork"/' "$G"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $((100000 + GITHUB_RUN_NUMBER))/" "$G"
          sed -i -E "s/versionName = \"([^\"]+)\"/versionName = \"\1-fork.${GITHUB_RUN_NUMBER}\"/" "$G"
          sed -i 's/android:targetPackage="com\.lasrecomp\.android"/android:targetPackage="com.lasrecomp.android.fork"/' \
              android/lasrecomp/app/src/main/res/xml/shortcuts.xml
          sed -i 's/android:label="LAS Recomp"/android:label="LAS Recomp Fork"/' \
              android/lasrecomp/app/src/main/AndroidManifest.xml
          grep -n "applicationId\|versionCode\|versionName" "$G"

      - name: Cle de signature
        run: |
          mkdir -p "$HOME/.lasrecomp"
          echo "$FORK_KEYSTORE_B64" | base64 -d > "$HOME/.lasrecomp/fork.p12"
          {
            echo "storeFile=$HOME/.lasrecomp/fork.p12"
            echo "storePassword=$FORK_KEYSTORE_PASS"
            echo "keyAlias=lasfork"
            echo "keyPassword=$FORK_KEYSTORE_PASS"
          } > "$HOME/.lasrecomp/keystore.properties"

      - name: Compilation de l'APK
        working-directory: android/lasrecomp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: |
          cp android/lasrecomp/app/build/outputs/apk/release/app-release.apk "LASRecomp-fork-${GITHUB_RUN_NUMBER}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-fork-${{ github.run_number }}
          path: LASRecomp-fork-*.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fork-${GITHUB_RUN_NUMBER}" "LASRecomp-fork-${GITHUB_RUN_NUMBER}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fork build ${GITHUB_RUN_NUMBER}" \
            --notes "Build automatique du fork (commit ${GITHUB_SHA::7}). S'installe a cote de l'appli officielle."
