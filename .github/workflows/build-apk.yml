# .github/workflows/build-apk.yml
# Compile l'APK du fork sur GitHub (onglet Actions > "Build APK" > Run workflow).
# L'APK sort dans les Releases du depot. Il s'installe A COTE de l'appli officielle
# (identifiant com.lasrecomp.android.fork), sans toucher a ses sauvegardes.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      modifications:
        description: "Appliquer les modifications du fork (decocher = code d'origine)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  NDK_VERSION: 30.0.16248370
  CMAKE_VERSION: 3.30.4
  # Cle de signature du fork (usage personnel). Elle est publique dans ce depot :
  # elle sert seulement a ce que chaque build puisse se mettre a jour par-dessus le precedent.
  FORK_KEYSTORE_B64: 
  FORK_KEYSTORE_PASS: lasfork2026

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Modifications du fork (resolution adaptative, filtre doux)
        if: ${{ inputs.modifications }}
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # Modifications du fork, appliquees au code avant la compilation.
          # Chaque modification cherche un repere exact dans le fichier : si le code d'origine a change
          # et que le repere a disparu, le script s'arrete avec un message clair au lieu de compiler n'importe quoi.
          import sys

          def edit(path, anchor, new, where="after", count=1):
              src = open(path, encoding="utf-8").read()
              n = src.count(anchor)
              if n != count:
                  sys.exit("FORK: repere introuvable ou ambigu (%d fois au lieu de %d) dans %s :\n  %r" % (n, count, path, anchor))
              if where == "after":
                  out = src.replace(anchor, anchor + new)
              elif where == "before":
                  out = src.replace(anchor, new + anchor)
              else:
                  out = src.replace(anchor, new)
              open(path, "w", encoding="utf-8").write(out)
              print("FORK: %s modifie" % path)

          # Deux reglages (onglet Video du menu en jeu), tous deux desactives par defaut :
          #   fork_dyn  : resolution adaptative - la resolution interne choisie (1.25x et plus) devient un plafond
          #   fork_soft : filtre doux (B-spline cubique) a la place de l'Upscaler

          # ---------------------------------------------------------------- 1. les reglages
          edit("runtime/settings.h",
               "    bool shader_int32;",
               "    bool fork_dyn;        // (fork) a fixed internal resolution above 1x as a ceiling: nvn/output_scale.c\n"
               "    bool fork_soft;       // (fork) the picture scaled to the window by a smooth cubic filter: vulkan/exec.c post_process\n",
               "before")
          edit("runtime/settings.c",
               '        else if (!strcmp(key, "shader_int32")) g_settings.shader_int32 = atoi(val) != 0;\n',
               '        else if (!strcmp(key, "fork_dyn")) g_settings.fork_dyn = atoi(val) != 0;\n'
               '        else if (!strcmp(key, "fork_soft")) g_settings.fork_soft = atoi(val) != 0;\n')
          edit("runtime/settings.c",
               '    fprintf(f, "shader_int32 = %d\\n", g_settings.shader_int32);\n',
               '    fprintf(f, "fork_dyn = %d\\nfork_soft = %d\\n", g_settings.fork_dyn, g_settings.fork_soft);\n')

          # ---------------------------------------------------------------- 2. le menu (onglet Video)
          edit("runtime/ui/menu.mm",
               '    opt_toggle("Frame generation", &g_settings.frame_gen, false,',
               '''    // (fork)
              opt_toggle("Adaptive resolution (fork)", &g_settings.fork_dyn, false,
                         "With Internal resolution at 1.25x or more, that resolution becomes a ceiling: the game renders at it "
                         "while the GPU keeps up, and lower (down to 65% of it) while it doesn't. With frame generation on it "
                         "steps down early enough for the generated frames to keep coming. Each change is a short hitch.");
              opt_toggle("Soft filter (fork)", &g_settings.fork_soft, false,
                         "Scales the game image to the screen with a smooth cubic filter, in place of the Upscaler. A softer "
                         "picture, with less shimmer on fine detail such as tall grass while the camera moves.");
          ''',
               "before")

          # ---------------------------------------------------------------- 3. resolution adaptative (nvn/output_scale.c)
          edit("runtime/nvn/output_scale.c",
               "    double prev = g_dyn;\n",
               '''    double fk_hi = 14.5, fk_lo = 10.5, fk_floor = 0.5;  // (fork: the limits used below, as they were)
          #ifdef __ANDROID__
              if (g_settings.fork_dyn) {  // (fork) Adaptive resolution: a higher floor, and with frame generation the generated
                  fk_floor = 0.65;        // frames' share of the GPU kept free (20 ms of a 33.3 ms frame, back up under 15 ms)
                  if (g_settings.frame_gen) { fk_hi = 10.0; fk_lo = 7.5; }
              }
          #endif
          ''')
          edit("runtime/nvn/output_scale.c",
               "avg_gpu > 14.5 * budget : avg_dt > 17.4 * budget;",
               "avg_gpu > fk_hi * budget : avg_dt > 17.4 * budget;", "replace")
          edit("runtime/nvn/output_scale.c",
               "g_dyn = fmax(0.5, g_dyn - step);",
               "g_dyn = fmax(fk_floor, g_dyn - step);", "replace")
          edit("runtime/nvn/output_scale.c",
               "avg_gpu < 10.5 * budget && g_dyn_good >= 4",
               "avg_gpu < fk_lo * budget && g_dyn_good >= 4", "replace")
          edit("runtime/nvn/output_scale.c",
               "    h = fmax(h, 0.1);  // (.25x of a small window)\n",
               '''#ifdef __ANDROID__
              // (fork) Adaptive resolution: 1.25x / 1.5x / 2x .. as a ceiling, lowered while the GPU is at its limit
              if (g_settings.fork_dyn && forced <= 0 && h > 1.0 &&
                  ((mode >= 2 && mode <= 8) || mode == RES_X125 || mode == RES_X150)) {
                  dyn_update(now, gpu_ms);
                  h *= g_dyn;
              }
          #endif
          ''',
               "before")

          # ---------------------------------------------------------------- 4. filtre doux (vulkan/shaders.c + exec.c)
          edit("runtime/nvn/vulkan/shaders.c",
               '    if (!strcmp(name, "post.vert")) {\n',
               r'''    // (fork) Soft filter: the picture resampled by a cubic B-spline (no negative lobes: smooth, no ringing), its 16
              // texels read as 4 bilinear taps. a = (1 / input size, input size), b.xy = output size.
              if (!strcmp(name, "fork_soft.frag")) {
                  *stage = STAGE_FRAGMENT;
                  return "#version 450\n"
                         "layout(set = 0, binding = 0) uniform sampler2D t;\n"
                         "layout(push_constant) uniform P { vec4 a; vec4 b; } pc;\n"
                         "layout(location = 0) out vec4 o;\n"
                         "void main() {\n"
                         "  vec2 st = gl_FragCoord.xy / pc.b.xy * pc.a.zw - 0.5;\n"
                         "  vec2 i = floor(st), f = st - i;\n"
                         "  vec2 f2 = f * f, f3 = f2 * f;\n"
                         "  vec2 w0 = (1.0 - 3.0 * f + 3.0 * f2 - f3) / 6.0;\n"
                         "  vec2 w1 = (4.0 - 6.0 * f2 + 3.0 * f3) / 6.0;\n"
                         "  vec2 w3 = f3 / 6.0;\n"
                         "  vec2 w2 = 1.0 - w0 - w1 - w3;\n"
                         "  vec2 g0 = w0 + w1, g1 = w2 + w3;\n"
                         "  vec2 h0 = (i - 0.5 + w1 / g0) * pc.a.xy;\n"
                         "  vec2 h1 = (i + 1.5 + w3 / g1) * pc.a.xy;\n"
                         "  vec3 c = g0.y * (g0.x * textureLod(t, vec2(h0.x, h0.y), 0.0).rgb + g1.x * textureLod(t, vec2(h1.x, h0.y), 0.0).rgb) +\n"
                         "           g1.y * (g0.x * textureLod(t, vec2(h0.x, h1.y), 0.0).rgb + g1.x * textureLod(t, vec2(h1.x, h1.y), 0.0).rgb);\n"
                         "  o = vec4(c, 1.0);\n"
                         "}\n";
              }
          ''',
               "before")

          edit("runtime/nvn/vulkan/exec.c",
               "    if (!smaa && !fsr && !sgsr) return v;\n",
               '''#ifdef __ANDROID__
              bool soft = g_settings.fork_soft;  // (fork) Soft filter, in place of the upscaler
              if (soft) fsr = sgsr = false;
          #else
              bool soft = false;
          #endif
              if (!smaa && !fsr && !sgsr && !soft) return v;
          ''', "replace")

          edit("runtime/nvn/vulkan/exec.c",
               "        post_pass(cb, \"sgsr1.frag\", si, 1, e, ps, false);\n        v = post_view(e);\n    }\n",
               '''    if (soft) {  // (fork) shaders.c fork_soft.frag, into an image the size of the picture in the window
                  float iw = (float)b->width, ih = (float)b->height;
                  TexBackend *e = post_image(3, ow, oh);
                  float ps[8] = {1.0f / iw, 1.0f / ih, iw, ih, (float)ow, (float)oh};
                  VkImageView si[3] = {v};
                  post_pass(cb, "fork_soft.frag", si, 1, e, ps, false);
                  v = post_view(e);
              }
              {
                  static int fork_pso = -1;
                  if ((int)soft != fork_pso) {
                      fork_pso = soft;
                      LOG("[fork] soft filter %s (%ux%u -> %ux%u)\\n", soft ? "on" : "off", b->width, b->height, ow, oh);
                  }
              }
          ''')

          print("FORK: toutes les modifications sont appliquees")
          PYEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (NDK, CMake, plateforme)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
          # les scripts du projet lisent ces variables ; celles du runner pointent vers un autre NDK
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache des dependances compilees
        uses: actions/cache@v4
        with:
          path: |
            android/deps/out
            android/deps/src
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/*.sh') }}

      - name: Dependances de l'appli (SDL3, shaderc, Vulkan)
        run: bash android/deps/build_deps.sh

      - name: FFmpeg (videos du jeu)
        run: |
          if [ ! -f android/deps/out/lib/libavcodec.so ]; then bash android/deps/build_ffmpeg.sh; fi

      - name: Constructeur du code du jeu (Python, capstone, unicorn, lz4, zig)
        run: bash android/deps/build_gen_deps.sh

      - name: Identite du fork (installation a cote de l'appli officielle)
        run: |
          G=android/lasrecomp/app/build.gradle.kts
          sed -i -E 's/applicationId = "com\.lasrecomp\.android"/applicationId = "com.lasrecomp.android.fork"/' "$G"
          sed -i -E "s/versionCode = [0-9]+/versionCode = $((100000 + GITHUB_RUN_NUMBER))/" "$G"
          sed -i -E "s/versionName = \"([^\"]+)\"/versionName = \"\1-fork.${GITHUB_RUN_NUMBER}\"/" "$G"
          sed -i 's/android:targetPackage="com\.lasrecomp\.android"/android:targetPackage="com.lasrecomp.android.fork"/' \
              android/lasrecomp/app/src/main/res/xml/shortcuts.xml
          sed -i 's/android:label="LAS Recomp"/android:label="LAS Recomp Fork"/' \
              android/lasrecomp/app/src/main/AndroidManifest.xml
          grep -n "applicationId\|versionCode\|versionName" "$G"

      - name: Cle de signature
        run: |
          mkdir -p "$HOME/.lasrecomp"
          echo "$FORK_KEYSTORE_B64" | base64 -d > "$HOME/.lasrecomp/fork.p12"
          {
            echo "storeFile=$HOME/.lasrecomp/fork.p12"
            echo "storePassword=$FORK_KEYSTORE_PASS"
            echo "keyAlias=lasfork"
            echo "keyPassword=$FORK_KEYSTORE_PASS"
          } > "$HOME/.lasrecomp/keystore.properties"

      - name: Compilation de l'APK
        working-directory: android/lasrecomp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renommer l'APK
        run: |
          cp android/lasrecomp/app/build/outputs/apk/release/app-release.apk "LASRecomp-fork-${GITHUB_RUN_NUMBER}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LASRecomp-fork-${{ github.run_number }}
          path: LASRecomp-fork-*.apk

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "fork-${GITHUB_RUN_NUMBER}" "LASRecomp-fork-${GITHUB_RUN_NUMBER}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Fork build ${GITHUB_RUN_NUMBER}" \
            --notes "Build automatique du fork (commit ${GITHUB_SHA::7}). S'installe a cote de l'appli officielle."
